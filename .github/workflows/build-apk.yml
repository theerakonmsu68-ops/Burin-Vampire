name: Build Burin Vampire APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm install


      # ==========================================
      # 4. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7


      # ==========================================
      # 5. Prepare web files
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r images www/

          echo "===== WWW CONTENTS ====="
          find www -maxdepth 2 -type f
          echo "========================"


      # ==========================================
      # 6. Add Android platform
      # ==========================================
      - name: Add Android platform
        run: |
          npx cap add android


      # ==========================================
      # 7. Install Capacitor Assets
      # ==========================================
      - name: Install Capacitor Assets
        run: |
          npm install @capacitor/assets@latest --save-dev


      # ==========================================
      # 8. Prepare App Icon
      # ==========================================
      - name: Prepare App Icon
        run: |
          mkdir -p assets
          cp images/icon.png assets/icon.png

          echo "===== APP ICON ====="
          ls -lh assets/icon.png
          echo "==================="


      # ==========================================
      # 9. Generate Android icons
      # ==========================================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android


      # ==========================================
      # 10. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==========================================
      # 11. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 12. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # ==========================================
      # 13. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Burin-Vampire-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
